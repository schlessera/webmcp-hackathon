# Coolify deployment compose — separate from compose.yaml (local dev) so the
# dev watch/ports config stays untouched. Point a Coolify "Docker Compose"
# resource at this file. See docs/DEPLOY-COOLIFY.md.
#
# Differences from compose.yaml: no 127.0.0.1 host-port bindings (Coolify's
# reverse proxy routes to the app container over the internal network), a
# production NODE_ENV so the server serves the pre-built web bundle instead of
# Vite middleware, an idempotent one-shot seed on every deploy, and no
# cloudflared/e2e services.
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: webmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: webmcp
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmcp -d webmcp"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        BUILD_ID: ${SOURCE_COMMIT:-coolify}
    command: ["node", "apps/server/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://webmcp:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}@db:5432/webmcp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Idempotent: rooms upsert, legacy candidates are replaced, invite secrets are
  # HMAC-derived from DEMO_SECRET_KEY (stable across redeploys). Runs on each
  # deploy to top up room_demo without wiping a live session's widened scope.
  seed:
    build:
      context: .
      args:
        BUILD_ID: ${SOURCE_COMMIT:-coolify}
    command: ["node", "apps/server/src/seed.ts"]
    environment:
      DATABASE_URL: postgres://webmcp:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}@db:5432/webmcp
      DEMO_SECRET_KEY: ${DEMO_SECRET_KEY:?set a non-default DEMO_SECRET_KEY in Coolify}
      APP_URL: ${APP_URL:-https://example.coolify.app}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build:
      context: .
      args:
        BUILD_ID: ${SOURCE_COMMIT:-coolify}
    command: ["node", "apps/server/src/server.ts"]
    # Coolify assigns a domain to this port; set it on the app service in the UI
    # (or via SERVICE_FQDN_APP). No host binding — the proxy reaches app:4173.
    expose:
      - "4173"
    environment:
      DATABASE_URL: postgres://webmcp:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}@db:5432/webmcp
      NODE_ENV: production
      PUBLIC_ORIGIN: ${APP_URL:?set APP_URL to the HTTPS application origin}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set the actual reverse proxy IPs or CIDRs}
      GLOBAL_ROOM_LIMIT: ${GLOBAL_ROOM_LIMIT:-100}
      LLM_CALLS_PER_HOUR: ${LLM_CALLS_PER_HOUR:-600}
      LLM_CALLS_PER_DAY: ${LLM_CALLS_PER_DAY:-2000}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-6}
      OUTBOUND_CALLS_PER_HOUR: ${OUTBOUND_CALLS_PER_HOUR:-5000}
      OUTBOUND_CALLS_PER_DAY: ${OUTBOUND_CALLS_PER_DAY:-20000}
      PORT: "4173"
      ROOM_LIMIT: ${ROOM_LIMIT:-50}
      BUILD_ID: ${SOURCE_COMMIT:-coolify}
      DEMO_SECRET_KEY: ${DEMO_SECRET_KEY:?set a non-default DEMO_SECRET_KEY in Coolify}
      ORIGIN_TRIAL_TOKEN: ${ORIGIN_TRIAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PROVIDERS: ${OPENROUTER_PROVIDERS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5.6-luna}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-high}
      LLM_MODEL_ROUTE: ${LLM_MODEL_ROUTE:-}
      LLM_MODEL_JUDGE: ${LLM_MODEL_JUDGE:-}
      LLM_MODEL_AGENT: ${LLM_MODEL_AGENT:-}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-}
      NL_FAST_MODEL: ${NL_FAST_MODEL:-}
      NL_SMART_MODEL: ${NL_SMART_MODEL:-}
      MENU_READER_MODEL: ${MENU_READER_MODEL:-}
      REFINE: ${REFINE:-1}
      REFINE_IDLE_STOP_MS: ${REFINE_IDLE_STOP_MS:-600000}
      REFINE_TICK_MS: ${REFINE_TICK_MS:-1000}
      REFINE_IDLE_TICK_MS: ${REFINE_IDLE_TICK_MS:-30000}
      REFINE_MODEL_CALLS_PER_HOUR: ${REFINE_MODEL_CALLS_PER_HOUR:-200}
      REFINE_SEARCHES_PER_HOUR: ${REFINE_SEARCHES_PER_HOUR:-150}
      # Parallel is the default. Set this only to pin another provider.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      PARALLEL_SEARCH_MODE: ${PARALLEL_SEARCH_MODE:-turbo}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      LISTINGS: ${LISTINGS:-1}
      LISTINGS_MAX_PAGES_PER_BATCH: ${LISTINGS_MAX_PAGES_PER_BATCH:-5}
      OVERTURE: ${OVERTURE:-0}
      ACCESSIBILITY_CLOUD_TOKEN: ${ACCESSIBILITY_CLOUD_TOKEN:-}
      ACCESSIBILITY_CLOUD_SOURCE_IDS: ${ACCESSIBILITY_CLOUD_SOURCE_IDS:-}
      MODEL_CALL_COST_RESERVATION_USD: ${MODEL_CALL_COST_RESERVATION_USD:-0.05}
      OUTBOUND_INTERACTIVE_RESERVE_PERCENT: ${OUTBOUND_INTERACTIVE_RESERVE_PERCENT:-10}
      OUTBOUND_BACKGROUND_RESERVE_PERCENT: ${OUTBOUND_BACKGROUND_RESERVE_PERCENT:-20}
      LLM_INTERACTIVE_RESERVE_PERCENT: ${LLM_INTERACTIVE_RESERVE_PERCENT:-10}
      LLM_BACKGROUND_RESERVE_PERCENT: ${LLM_BACKGROUND_RESERVE_PERCENT:-20}
      PARALLEL_CALLS_PER_HOUR: ${PARALLEL_CALLS_PER_HOUR:-5000}
      PARALLEL_CALLS_PER_DAY: ${PARALLEL_CALLS_PER_DAY:-20000}
      TAVILY_CALLS_PER_HOUR: ${TAVILY_CALLS_PER_HOUR:-5000}
      TAVILY_CALLS_PER_DAY: ${TAVILY_CALLS_PER_DAY:-20000}
      DATAFORSEO_CALLS_PER_HOUR: ${DATAFORSEO_CALLS_PER_HOUR:-5000}
      DATAFORSEO_CALLS_PER_DAY: ${DATAFORSEO_CALLS_PER_DAY:-20000}
      ACCESSIBILITY_CALLS_PER_HOUR: ${ACCESSIBILITY_CALLS_PER_HOUR:-5000}
      ACCESSIBILITY_CALLS_PER_DAY: ${ACCESSIBILITY_CALLS_PER_DAY:-20000}
      PROXY_URL: ${PROXY_URL:-}
      PROXY: ${PROXY:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/api/meta || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    mem_limit: 1536m
    pids_limit: 256
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  dbdata:
