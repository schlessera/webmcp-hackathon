services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: webmcp
      POSTGRES_PASSWORD: webmcp
      POSTGRES_DB: webmcp
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmcp -d webmcp"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "apps/server/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://webmcp:webmcp@db:5432/webmcp
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: ["node", "apps/server/src/server.ts"]
    environment:
      DATABASE_URL: postgres://webmcp:webmcp@db:5432/webmcp
      NODE_ENV: ${APP_ENV:-development}
      ALLOW_LEGACY_MEMBER_INVITES: "1" # local demo fixtures; ignored in production
      PORT: "4173"
      ORIGIN_TRIAL_TOKEN: ${ORIGIN_TRIAL_TOKEN:-}
      DEMO_SECRET_KEY: ${DEMO_SECRET_KEY:-local-dev-only}
      # The natural-language surface (docs/NL-AGENT.md). Absent: the composer
      # keeps its label matching and no agent card ever appears.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PROVIDERS: ${OPENROUTER_PROVIDERS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5.6-luna}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-xhigh}
      LLM_MODEL_ROUTE: ${LLM_MODEL_ROUTE:-}
      LLM_MODEL_JUDGE: ${LLM_MODEL_JUDGE:-}
      LLM_MODEL_AGENT: ${LLM_MODEL_AGENT:-}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      PARALLEL_SEARCH_MODE: ${PARALLEL_SEARCH_MODE:-turbo}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      # Parallel is the default. Set this only to pin another provider.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LISTINGS: ${LISTINGS:-1}
      LISTINGS_MAX_PAGES_PER_BATCH: ${LISTINGS_MAX_PAGES_PER_BATCH:-5}
      OVERTURE: ${OVERTURE:-0}
      ACCESSIBILITY_CLOUD_TOKEN: ${ACCESSIBILITY_CLOUD_TOKEN:-}
      ACCESSIBILITY_CLOUD_SOURCE_IDS: ${ACCESSIBILITY_CLOUD_SOURCE_IDS:-}
      MODEL_CALL_COST_RESERVATION_USD: ${MODEL_CALL_COST_RESERVATION_USD:-0.05}
      OUTBOUND_INTERACTIVE_RESERVE_PERCENT: ${OUTBOUND_INTERACTIVE_RESERVE_PERCENT:-10}
      OUTBOUND_BACKGROUND_RESERVE_PERCENT: ${OUTBOUND_BACKGROUND_RESERVE_PERCENT:-20}
      LLM_INTERACTIVE_RESERVE_PERCENT: ${LLM_INTERACTIVE_RESERVE_PERCENT:-10}
      LLM_BACKGROUND_RESERVE_PERCENT: ${LLM_BACKGROUND_RESERVE_PERCENT:-20}
      PARALLEL_CALLS_PER_HOUR: ${PARALLEL_CALLS_PER_HOUR:-5000}
      PARALLEL_CALLS_PER_DAY: ${PARALLEL_CALLS_PER_DAY:-20000}
      TAVILY_CALLS_PER_HOUR: ${TAVILY_CALLS_PER_HOUR:-5000}
      TAVILY_CALLS_PER_DAY: ${TAVILY_CALLS_PER_DAY:-20000}
      DATAFORSEO_CALLS_PER_HOUR: ${DATAFORSEO_CALLS_PER_HOUR:-5000}
      DATAFORSEO_CALLS_PER_DAY: ${DATAFORSEO_CALLS_PER_DAY:-20000}
      ACCESSIBILITY_CALLS_PER_HOUR: ${ACCESSIBILITY_CALLS_PER_HOUR:-5000}
      ACCESSIBILITY_CALLS_PER_DAY: ${ACCESSIBILITY_CALLS_PER_DAY:-20000}
      NL_FAST_MODEL: ${NL_FAST_MODEL:-}
      NL_SMART_MODEL: ${NL_SMART_MODEL:-}
      MENU_READER_MODEL: ${MENU_READER_MODEL:-}
      PROXY_URL: ${PROXY_URL:-}
      PROXY: ${PROXY:-1}
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        # Ordinary UI code: sync into the container, Vite handles HMR.
        - action: sync
          path: ./apps/web/src
          target: /repo/apps/web/src
        - action: sync
          path: ./apps/web/index.html
          target: /repo/apps/web/index.html
        # Server or contract changes: restart (new buildId -> clients reload).
        - action: sync+restart
          path: ./apps/server/src
          target: /repo/apps/server/src
        - action: sync+restart
          path: ./packages/contracts/src
          target: /repo/packages/contracts/src
        # Dependency or image changes: rebuild.
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./packages/contracts/contract-manifest.json

  seed-demo:
    build: .
    profiles: ["seed"]
    command: ["node", "apps/server/src/seed.ts"]
    environment:
      DATABASE_URL: postgres://webmcp:webmcp@db:5432/webmcp
      DEMO_SECRET_KEY: ${DEMO_SECRET_KEY:-local-dev-only}
      APP_URL: ${APP_URL:-http://127.0.0.1:4173}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  e2e:
    profiles: ["e2e"]
    # Must match the @playwright/test version the lockfile resolves.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      # The spec spawns its own server inside the container; it needs only db.
      DATABASE_URL: postgres://webmcp:webmcp@db:5432/webmcp
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["npx", "playwright", "test", "tests/e2e/three-user.spec.ts"]

  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.8.0
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Required for the public profile; validated by cloudflared at startup.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_started

volumes:
  dbdata:
